title: Number of edges
description: >-
  Counts the directed ties present in the network. Acts as the baseline
  density term, playing the role an intercept plays in a regression
  model.
citation:
  - key: holland1981
    doi: 10.1080/01621459.1981.10477598
plot:
  edgelist: "0->1"
  vcolor: black
  ecolor: black
  layout:
    x: [0, 1]
    y: [0, 0]
math: |
  \sum_{i \neq j} y_{ij}
