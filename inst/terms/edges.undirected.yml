title: Number of edges
description: >-
  Counts the ties present in the network. Acts as the baseline density
  term, playing the role an intercept plays in a regression model.
plot:
  edgelist: "0->1"
  vcolor: black
  ecolor: black
  layout:
    x: [0, 1]
    y: [0, 0]
math: |
  \sum_{i<j} y_{ij}
