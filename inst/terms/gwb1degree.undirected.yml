title: Geometrically weighted degree distribution (first mode)
description: >-
  Summarizes the degree distribution of first-mode nodes with
  geometrically decreasing weights. Captures whether ties to the second
  mode concentrate on a few highly active first-mode nodes or spread
  evenly across them.
citation:
  - key: wang2009
    doi: 10.1016/j.socnet.2008.08.002
  - key: hunter2007
    doi: 10.1016/j.socnet.2006.08.005
plot:
  edgelist: "0->1, 0->2, 0->3"
  vcolor: [black, gray, gray, gray]
  vshape: [square, circle, circle, circle]
  vsize: [1.0, .5, .5, .5]
  ecolor: black
  layout:
    x: [0, 1, 1, 1]
    y: [0, .5, 0, -.5]
math: |
  \exp{(\tau)} \sum_{i=1}^{n_{B_2}} \left[1 - \left(1 - \exp{(-\tau)}\right)^i\right] D^{B_1}_i(y)
