title: Geometrically weighted degree distribution (second mode)
description: >-
  Summarizes the degree distribution of second-mode nodes with
  geometrically decreasing weights. Captures whether ties from the first
  mode concentrate on a few popular second-mode nodes or spread evenly
  across them.
citation:
  - key: hunter2007
    doi: 10.1016/j.socnet.2006.08.005
plot:
  edgelist: "0->3, 1->3, 2->3"
  vcolor: [black, black, black, black]
  vshape: [square, square, square, circle]
  vsize: [.5, .5, .5, 1.0]
  ecolor: black
  layout:
    x: [0, 0, 0, 1]
    y: [.5, 0, -.5, 0]
math: |
  \exp{(\tau)} \sum_{i=1}^{n_{B_1}} \left[1 - \left(1 - \exp{(-\tau)}\right)^i\right] D_i(y)
