title: Geometrically weighted degree distribution
description: >-
  Summarizes the degree distribution with geometrically decreasing
  weights. Captures whether ties concentrate on a few high-degree nodes
  or spread evenly, and stabilizes models that would otherwise
  degenerate.
citation:
  - key: snijders2006
    doi: 10.1111/j.1467-9531.2006.00176.x
  - key: hunter2007
    doi: 10.1016/j.socnet.2006.08.005
plot:
  edgelist: "0->1, 0->2, 0->3"
  vcolor: [black, black, black, black]
  vsize: [1.0, .5, .5, .5]
  ecolor: black
  layout:
    x: [0, 1, 1, 1]
    y: [0, .5, 0, -.5]
math: |
  \exp{(\tau)} \sum_{i=1}^{n-1} \left[1 - \left(1 - \exp{(-\tau)}\right)^i\right] D_i(y)
