title: Geometrically weighted dyadwise shared partners
description: >-
  Summarizes shared partners over every dyad, tied or not, with
  geometrically decreasing weights. Commonly paired with gwesp to
  separate shared partnership from closure itself.
citation:
  - key: hunter2007
    doi: 10.1016/j.socnet.2006.08.005
plot:
  edgelist: "0->2, 1->2, 0->3, 1->3, 0->4, 1->4"
  vcolor: [black, black, gray, gray, gray]
  vsize: [1.0, 1.0, .5, .5, .5]
  ecolor: gray
  layout:
    x: [0, 1, .5, .5, .5]
    y: [0, 0, .45, .85, 1.25]
math: |
  \exp{(\tau)} \sum_{i=1}^{n-2} \left[1 - \left(1 - \exp{(-\tau)}\right)^i\right] DP_i(y)
