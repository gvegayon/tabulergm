title: Geometrically weighted edgewise shared partners
description: >-
  Summarizes how many partners tied nodes share, weighting each
  additional shared partner geometrically less than the last. Provides a
  better-behaved measure of transitive closure than a raw triangle
  count; the decay parameter controls how fast the weights fall off.
citation:
  - key: hunter2007
    doi: 10.1016/j.socnet.2006.08.005
plot:
  edgelist: "0->1, 0->2, 1->2, 0->3, 1->3, 0->4, 1->4"
  vcolor: [black, black, gray, gray, gray]
  vsize: [1.0, 1.0, .5, .5, .5]
  ecolor: [black, gray, gray, gray, gray, gray, gray]
  layout:
    x: [0, 1, .5, .5, .5]
    y: [0, 0, .45, .85, 1.25]
math: |
  \exp{(\tau)} \sum_{i=1}^{n-2} \left[1 - \left(1 - \exp{(-\tau)}\right)^i\right] EP_i(y)
