title: Geometrically weighted in-degree distribution
description: >-
  Summarizes the in-degree distribution with geometrically decreasing
  weights. Captures whether incoming ties concentrate on a few popular
  nodes or spread evenly across receivers.
citation:
  - key: hunter2007
    doi: 10.1016/j.socnet.2006.08.005
  - key: robins2009
    doi: 10.1016/j.socnet.2008.10.006
plot:
  edgelist: "1->0, 2->0, 3->0"
  vcolor: [gray, gray, gray, black]
  vsize: [.5, .5, .5, 1.0]
  ecolor: black
  layout:
    x: [0, 0, 0, 1]
    y: [.5, 0, -.5, 0]
math: |
  \exp{(\tau)} \sum_{i=1}^{n-1} \left[1 - \left(1 - \exp{(-\tau)}\right)^i\right] D^{\mathrm{in}}_i(y)
