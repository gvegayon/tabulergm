title: Geometrically weighted out-degree distribution
description: >-
  Summarizes the out-degree distribution with geometrically decreasing
  weights. Captures whether outgoing ties concentrate on a few highly
  active nodes or spread evenly across senders.
citation:
  - key: hunter2007
    doi: 10.1016/j.socnet.2006.08.005
plot:
  edgelist: "0->1, 0->2, 0->3"
  vcolor: [black, gray, gray, gray]
  vsize: [1.0, .5, .5, .5]
  ecolor: black
  layout:
    x: [0, 1, 1, 1]
    y: [0, .5, 0, -.5]
math: |
  \exp{(\tau)} \sum_{i=1}^{n-1} \left[1 - \left(1 - \exp{(-\tau)}\right)^i\right] D^{\mathrm{out}}_i(y)
