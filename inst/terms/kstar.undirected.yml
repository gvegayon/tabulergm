title: k-stars
description: >-
  Counts the sets of k ties that share a common node, a Markov
  dependence measure of degree heterogeneity. Pass several values of k
  to include one statistic per star size.
citation:
  - key: frank1986
    doi: 10.1080/01621459.1986.10478342
plot:
  edgelist: "0->1, 0->2, 0->3"
  vcolor: [black, black, black, black]
  vsize: [1.0, 1.0, 1.0, 1.0]
  ecolor: black
  layout:
    x: [0, 1, 1, 1]
    y: [0, .5, 0, -.5]
math: |
  \sum_{i} \binom{\sum_{j \neq i} y_{ij}}{k}
