title: Attribute popularity
description: >-
  Counts the incoming ties received by nodes at each level of a
  categorical attribute, measuring how popular nodes with that value
  are as receivers.
plot:
  edgelist: "1->0, 2->0, 3->0"
  vcolor: [gray, gray, gray, orange]
  vsize: [.5, .5, .5, 1.0]
  ecolor: black
  layout:
    x: [0, 0, 0, 1]
    y: [.5, 0, -.5, 0]
math: |
  \sum_{i \neq j} y_{ij} \mathbf{1}(x_j = k)
