title: Out-stars
description: >-
  Counts the sets of k outgoing ties that share a common sender,
  capturing the spread of out-degrees (activity). Pass several values
  of k to include one statistic per star size.
plot:
  edgelist: "0->1, 0->2, 0->3"
  vcolor: [black, black, black, black]
  vsize: [1.0, .5, .5, .5]
  ecolor: black
  layout:
    x: [0, 1, 1, 1]
    y: [0, .5, 0, -.5]
math: |
  \sum_{i} \binom{\sum_{j \neq i} y_{ij}}{k}
