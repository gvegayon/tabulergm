title: Triangles
description: >-
  Counts transitive and cyclic triples among three connected nodes, the
  directed analogue of clustering. Equals the sum of the ttriple and
  ctriple statistics.
citation:
  - key: wasserman1996
    doi: 10.1007/BF02294547
plot:
  edgelist: "0->1->2, 0->2"
  vcolor: black
  ecolor: black
  layout:
    x: [0, 0.5, 1]
    y: [0, 1, 0]
math: |
  \sum_{i \neq j \neq k} y_{ij} y_{jk} y_{ik} + \frac{1}{3} \sum_{i \neq j \neq k} y_{ij} y_{jk} y_{ki}
